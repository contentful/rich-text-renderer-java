name: Release

# Manual: Actions -> Release -> Run workflow (branch master), type the version from build.gradle.
# Tests, then tag X.Y.Z, create the GitHub release and build the tag on JitPack. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release. Must equal the version in build.gradle.
        required: true
        type: string
      dry-run:
        description: Dry run. Validate and test, but tag, release and build nothing (any branch).
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Releases run from master only
        if: ${{ github.ref != 'refs/heads/master' && !inputs.dry-run }}
        run: |
          echo "::error::Run the Release workflow on master (it ran on ${GITHUB_REF_NAME}), or tick dry run."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
        run: .buildscript/release.sh validate

  test:
    name: Test
    needs: validate
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag
        run: .buildscript/release.sh tag

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .buildscript/release.sh github-release

      - name: Build on JitPack
        run: .buildscript/release.sh jitpack
